server {
    listen 80;
    server_name localhost _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12g;

    location = /bif-viewer {
        return 301 /bif-viewer/;
    }

    # index.html asla cache'lenmesin (hashed asset yeni adla gelir)
    location = /bif-viewer/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files $uri =404;
    }

    location /bif-viewer/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset'ler immutable
    location /bif-viewer/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # YOLOv8 model servisi (bif-viewer-model:8000) — aynı origin üzerinden proxy
    location /bif-viewer/model-api/ {
        proxy_pass http://bif-viewer-model:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Useful when container is tested directly without gateway.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
