server {
    listen 80;
    server_name localhost _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12g;

    location = /bif-viewer {
        return 301 /bif-viewer/;
    }

    location /bif-viewer/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # Useful when container is tested directly without gateway.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
