worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=30s ipv6=off;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 12g;
    client_header_buffer_size 16k;
    large_client_header_buffers 8 64k;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    upstream gateway_keycloak_cluster {
        server gateway-keycloak-1:8080 max_fails=3 fail_timeout=10s;
        server gateway-keycloak-2:8080 backup;
    }

    # Internal Keycloak proxy for Docker-network server-to-server calls.
    server {
        listen 8090;
        server_name gateway.local gateway-nginx _;

        location /keycloak/ {
            proxy_pass http://gateway_keycloak_cluster/keycloak/;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 80;
        server_name localhost _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost _;

        ssl_certificate /etc/nginx/internal-certs/shared-dev.crt;
        ssl_certificate_key /etc/nginx/internal-certs/shared-dev.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Shared OAuth2 proxy routes. All rooms use these; no per-room oauth container is needed.
        location /oauth2/ {
            proxy_pass http://gateway-oauth2-proxy:4180;
            proxy_intercept_errors on;
            error_page 403 = @forbidden;
            proxy_buffer_size 128k;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 256k;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Auth-Request-Redirect $request_uri;
        }

        # Internal auth endpoint. Room configs call:
        # auth_request /_oauth2/auth?allowed_groups=...;
        location = /_oauth2/auth {
            internal;
            proxy_pass http://gateway-oauth2-proxy:4180/oauth2/auth$is_args$args;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Auth-Request-Redirect $request_uri;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location /keycloak/ {
            proxy_pass http://gateway_keycloak_cluster/keycloak/;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_buffer_size 128k;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 256k;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 443;
        }

        location = /keycloak {
            return 301 /keycloak/;
        }

        location = / {
            return 302 /keycloak/;
        }

        location @forbidden {
            internal;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            root /etc/nginx/error-pages;
            try_files /forbidden.html =403;
        }

        # Rooms are plug-ins. Gateway core does not know BIF/PACS internals.
        include /etc/nginx/rooms-enabled/*.conf;
    }
}
