# BIF Viewer room
# Enable/disable this file to attach/detach the BIF room.

location = /_oauth2/auth_bif {
    internal;
    proxy_pass http://gateway-oauth2-proxy:4180/oauth2/auth?allowed_groups=bif-viewer&allowed_groups=bif-master&allowed_groups=gateway-admin;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Auth-Request-Redirect $request_uri;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

location = /bif-viewer {
    return 301 /bif-viewer/;
}

location = /bif-viewer/logout {
    return 302 /oauth2/sign_out?rd=$scheme://$http_host/bif-viewer/;
}

location /bif-viewer/api/ {
#     auth_request /_oauth2/auth?allowed_groups=bif-master&allowed_groups=bif-viewer&allowed_groups=gateway-admin;
    auth_request /_oauth2/auth_bif;
    error_page 401 = @bif_api_unauthorized;
    error_page 403 = @bif_api_forbidden;

    client_max_body_size 50g;
    client_body_timeout 3600s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 60s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    auth_request_set $auth_user $upstream_http_x_auth_request_user;
    auth_request_set $auth_email $upstream_http_x_auth_request_email;
    auth_request_set $auth_groups $upstream_http_x_auth_request_groups;
    auth_request_set $auth_preferred_username $upstream_http_x_auth_request_preferred_username;

    set $bif_api_upstream http://bif-viewer-app:8080;
    proxy_pass $bif_api_upstream;
    proxy_intercept_errors off;
    proxy_http_version 1.1;
    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 256k;

    # Prevent large gateway cookies from reaching Tomcat.
    proxy_set_header Cookie "";

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Prefix /bif-viewer;
    proxy_set_header X-Auth-Request-User $auth_user;
    proxy_set_header X-Auth-Request-Email $auth_email;
    proxy_set_header X-Auth-Request-Groups $auth_groups;
    proxy_set_header X-Auth-Request-Preferred-Username $auth_preferred_username;
}

location /bif-viewer/ {
#     auth_request /_oauth2/auth?allowed_groups=bif-master&allowed_groups=bif-viewer&allowed_groups=gateway-admin;
    auth_request /_oauth2/auth_bif;
    error_page 401 = /oauth2/sign_in?rd=$scheme://$http_host$request_uri;
    error_page 403 = @forbidden;

    auth_request_set $auth_user $upstream_http_x_auth_request_user;
    auth_request_set $auth_email $upstream_http_x_auth_request_email;
    auth_request_set $auth_groups $upstream_http_x_auth_request_groups;
    auth_request_set $auth_preferred_username $upstream_http_x_auth_request_preferred_username;

    set $bif_frontend_upstream http://bif-viewer-app:80;
    proxy_pass $bif_frontend_upstream;
    proxy_intercept_errors off;
    proxy_http_version 1.1;
    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 256k;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Prefix /bif-viewer;
    proxy_set_header X-Auth-Request-User $auth_user;
    proxy_set_header X-Auth-Request-Email $auth_email;
    proxy_set_header X-Auth-Request-Groups $auth_groups;
    proxy_set_header X-Auth-Request-Preferred-Username $auth_preferred_username;
}

location @bif_api_unauthorized {
    internal;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    default_type application/json;
    return 401 '{"error":"unauthorized"}';
}

location @bif_api_forbidden {
    internal;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    default_type application/json;
    return 403 '{"error":"forbidden"}';
}