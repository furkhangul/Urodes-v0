# PACS Viewer room
# Gateway-centered auth.
# PACS viewer app + dcm4chee UI/DICOMweb routes.

location = /_oauth2/auth_pacs_viewer {
    internal;
    proxy_pass http://gateway-oauth2-proxy:4180/oauth2/auth?allowed_groups=pacs-viewer&allowed_groups=pacs-admin&allowed_groups=gateway-admin;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Auth-Request-Redirect $request_uri;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

location = /_oauth2/auth_pacs_admin {
    internal;
    proxy_pass http://gateway-oauth2-proxy:4180/oauth2/auth?allowed_groups=pacs-admin&allowed_groups=gateway-admin;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Auth-Request-Redirect $request_uri;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

location = /pacs-viewer {
    return 301 /pacs-viewer/;
}

location = /pacs-viewer/logout {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    return 302 "https://localhost/oauth2/sign_out?rd=https%3A%2F%2Flocalhost%2Fkeycloak%2Frealms%2Fgateway%2Fprotocol%2Fopenid-connect%2Flogout%3Fclient_id%3Dgateway-oauth2-proxy%26post_logout_redirect_uri%3Dhttps%253A%252F%252Flocalhost%252F";
}

location = /dcm4chee-arc {
    return 301 /dcm4chee-arc/ui2/;
}

location /pacs-viewer/ {
    auth_request /_oauth2/auth_pacs_viewer;
    error_page 401 = /oauth2/sign_in?rd=$scheme://$http_host$request_uri;
    error_page 403 = @forbidden;

    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    auth_request_set $auth_user $upstream_http_x_auth_request_user;
    auth_request_set $auth_email $upstream_http_x_auth_request_email;
    auth_request_set $auth_groups $upstream_http_x_auth_request_groups;
    auth_request_set $auth_preferred_username $upstream_http_x_auth_request_preferred_username;

    proxy_pass http://pacs-viewer-app:80;
    proxy_intercept_errors off;
    proxy_http_version 1.1;

    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 256k;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Prefix /pacs-viewer;

    proxy_set_header X-Auth-Request-User $auth_user;
    proxy_set_header X-Auth-Request-Email $auth_email;
    proxy_set_header X-Auth-Request-Groups $auth_groups;
    proxy_set_header X-Auth-Request-Preferred-Username $auth_preferred_username;
}

# dcm4chee's own UI is admin-only.
location /dcm4chee-arc/ui2/ {
    auth_request /_oauth2/auth_pacs_admin;
    error_page 401 = /oauth2/sign_in?rd=$scheme://$http_host$request_uri;
    error_page 403 = @forbidden;

    proxy_pass http://pacs-viewer-arc:8080;
    proxy_intercept_errors off;
    proxy_http_version 1.1;

    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 256k;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Accept $http_accept;
    proxy_set_header Authorization $http_authorization;
}

# DICOMweb/WADO endpoints are available to PACS viewers and admins.
location /dcm4chee-arc/ {
    auth_request /_oauth2/auth_pacs_viewer;
    error_page 401 = /oauth2/sign_in?rd=$scheme://$http_host$request_uri;
    error_page 403 = @forbidden;

    proxy_pass http://pacs-viewer-arc:8080;
    proxy_intercept_errors off;
    proxy_http_version 1.1;

    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 256k;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Accept $http_accept;
    proxy_set_header Authorization $http_authorization;
}