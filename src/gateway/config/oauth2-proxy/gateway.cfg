http_address = "0.0.0.0:4180"
reverse_proxy = true
proxy_prefix = "/oauth2"

provider = "keycloak-oidc"
provider_display_name = "Gateway Keycloak"
skip_oidc_discovery = true

# Browser-facing issuer/login URLs use public domain.
oidc_issuer_url = "https://localhost/keycloak/realms/gateway"
login_url = "https://localhost/keycloak/realms/gateway/protocol/openid-connect/auth"

# Server-to-server token/userinfo/JWKS calls stay inside Docker network.
redeem_url = "http://gateway-nginx:8090/keycloak/realms/gateway/protocol/openid-connect/token"
profile_url = "http://gateway-nginx:8090/keycloak/realms/gateway/protocol/openid-connect/userinfo"
oidc_jwks_url = "http://gateway-nginx:8090/keycloak/realms/gateway/protocol/openid-connect/certs"
backend_logout_url = "http://gateway-nginx:8090/keycloak/realms/gateway/protocol/openid-connect/logout?id_token_hint={id_token}"

insecure_oidc_skip_issuer_verification = true
insecure_oidc_allow_unverified_email = true
ssl_insecure_skip_verify = true

client_id = "gateway-oauth2-proxy"
client_secret = "gateway-oauth2-proxy-secret"
redirect_url = "https://localhost/oauth2/callback"
whitelist_domains = ["localhost"]

email_domains = ["*"]
scope = "openid profile email"
oidc_groups_claim = "groups"
oidc_audience_claims = ["azp"]
code_challenge_method = "S256"

cookie_name = "_gateway_oauth2_proxy"
cookie_secret = "0123456789abcdef0123456789abcdef"
cookie_secure = true
cookie_samesite = "lax"
cookie_expire = "8h"
cookie_refresh = "1h"

skip_provider_button = true
pass_access_token = false
pass_authorization_header = false
set_authorization_header = false
set_xauthrequest = true
pass_host_header = true
