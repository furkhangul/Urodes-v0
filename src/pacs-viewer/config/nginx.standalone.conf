server {
    listen 80;
    server_name localhost;

    location = / {
        return 301 /pacs-viewer/;
    }

    # 1. Frontend (React)
    location /pacs-viewer/ {
        alias /usr/share/nginx/html/; 
        index index.html;
        try_files $uri $uri/ /pacs-viewer/index.html;
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "require-corp";
    }

    # 2. PACS API & UI (KIRMIZI HATALARI ÇÖZEN KISIM)
    # Regex yerine prefix match kullanıyoruz
    location /dcm4chee-arc/ {
        # Değişken kullanmadan doğrudan servis adını yazıyoruz. 
        # Nginx bu şekilde /dcm4chee-arc/ui2/ isteğini alır ve sonundaki 
        # tüm alt yolları doğru şekilde PACS archive konteynerine iletir.
        proxy_pass http://pacs-viewer-arc:8080/dcm4chee-arc/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Accept $http_accept; # Cornerstone'un 'multipart/related' isteği için kritik
        
        # Büyük tıbbi dosyalar (mamografi/sitoloji) için timeout
        proxy_read_timeout 300s;
    }

    # Tarayıcıya yazdığın kısa yol için ek destek
    location /dcm4chee/ {
        proxy_pass http://pacs-viewer-arc:8080/dcm4chee-arc/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
